# Hold the core packages at 100% coverage while @slackwater/react ramps up.
# react is held at "don't regress" (auto target with 1% slack) instead.
comment: false
coverage:
  status:
    project:
      core:
        target: 100%
        paths:
          - "packages/api/"
          - "packages/cli/"
          - "packages/slackwater/"
          - "packages/engine/"
      react:
        target: auto
        threshold: 1%
        paths:
          - "packages/react/"
    patch:
      core:
        target: 100%
        paths:
          - "packages/api/"
          - "packages/cli/"
          - "packages/slackwater/"
          - "packages/engine/"
      react:
        target: auto
        threshold: 1%
        paths:
          - "packages/react/"
