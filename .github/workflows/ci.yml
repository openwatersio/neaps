name: CI
on:
  push:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      swift: ${{ steps.filter.outputs.swift }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo 'typescript=true' >> "$GITHUB_OUTPUT"
            echo 'swift=true' >> "$GITHUB_OUTPUT"
            echo 'fixtures=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only origin/main...HEAD)
          echo "$changed"
          if [ -z "$changed" ]; then
            echo 'typescript=false' >> "$GITHUB_OUTPUT"
            echo 'swift=false' >> "$GITHUB_OUTPUT"
            echo 'fixtures=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -qEv '^(swift/|Package\.swift$)'; then
            echo 'typescript=true' >> "$GITHUB_OUTPUT"
          else
            echo 'typescript=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(swift/|fixtures/|Package\.swift$|\.github/workflows/)'; then
            echo 'swift=true' >> "$GITHUB_OUTPUT"
          else
            echo 'swift=false' >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE '^(fixtures/|packages/tide-predictor/|swift/Sources/Neaps/Resources/|package\.json$|tsconfig\.json$|tsdown\.config\.js$|\.github/workflows/)'; then
            echo 'fixtures=true' >> "$GITHUB_OUTPUT"
          else
            echo 'fixtures=false' >> "$GITHUB_OUTPUT"
          fi

  changeset:
    needs: changes
    if: github.ref != 'refs/heads/main' && needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Fetch base branch
        run: git fetch origin main --depth=1

  lint:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Lint code
        run: npm run lint

  test:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Do not run npm build here! This intentonally runs tests against the unbuilt source
      # to ensure that the tests are properly configured to run against the source files.

      - name: Test
        run: npm run coverage

      - name: Report coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: ./coverage/coverage-final.json

  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Test Swift
        run: swift test -c release

      - name: Compile for watchOS
        if: runner.os == 'macOS'
        run: swift build --scratch-path .build-watch --triple arm64_32-apple-watchos9.0 --sdk "$(xcrun --sdk watchos --show-sdk-path)"

  fixtures:
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Check fixtures
        run: npm run fixtures:check

  publish:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install modules
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to pkg.pr.new
        run: npx pkg-pr-new publish ./packages/*

  benchmarks:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    uses: ./.github/workflows/benchmarks.yml

  examples:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install modules
        run: npm install

      - name: Build
        run: npm run build

      - name: Run examples
        run: for e in examples/*.ts; do node "$e"; done
